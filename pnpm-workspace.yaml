packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
allowedDeprecatedVersions:
  # Transitive dep of @lit-labs/ssr -> node-fetch -> fetch-blob. Deprecated
  # in favor of Node's native global DOMException (available since Node 17),
  # but fetch-blob still requires it and there's no newer @lit-labs/ssr
  # release yet that drops node-fetch. Purely an install-time warning, no
  # functional or security impact — safe to acknowledge and silence.
  node-domexception: '*'
minimumReleaseAgeExclude:
  - '@storybook/addon-docs@10.4.3'
  - '@storybook/addon-vitest@10.4.3'
  - '@storybook/csf-plugin@10.4.3'
  - '@storybook/react-dom-shim@10.4.3'
  - '@storybook/addon-a11y@10.4.3'
  - '@storybook/builder-vite@10.4.3'
  - '@storybook/web-components-vite@10.4.3'
  - '@storybook/web-components@10.4.3'
  - storybook@10.4.3
  - '@tanstack/table-core@9.1.0'
