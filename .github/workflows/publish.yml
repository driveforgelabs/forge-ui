name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish to all packages (e.g. 4.2.0)'
        required: true
        type: string

jobs:
  publish:
    name: Build & Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package versions
        run: |
          npm version ${{ steps.resolve.outputs.version }} --no-git-tag-version --prefix packages/core
          npm version ${{ steps.resolve.outputs.version }} --no-git-tag-version --prefix packages/react

      - name: Build Workspace Packages
        run: pnpm build

      - name: Publish to NPM Registry
        run: pnpm -r publish --access public --no-git-checks --provenance

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/react/package.json
          git commit -m "chore: bump version to ${{ steps.resolve.outputs.version }}"
          git push origin HEAD:main
